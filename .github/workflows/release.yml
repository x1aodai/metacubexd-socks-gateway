name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    outputs:
      # release-please sets release_created to the STRING "false" when no release
      # is cut; GitHub Actions treats a non-empty string as truthy in `if:`, so
      # normalize to "true"/"" to gate the downstream jobs correctly.
      release_created: ${{ steps.release.outputs.release_created == 'true' && 'true' || '' }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.CI_TOKEN }}

  # All-in-one image (ghcr.io/metacubex/metacubexd-server): bundles the mihomo
  # kernel + Nitro server + dashboard in one container.
  release-server-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN (+ packages: write) can create the repo-owned package;
          # the CI_TOKEN PAT was denied create_package for the new server image.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: apps/server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MIHOMO_VERSION=v1.19.29
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/metacubex/metacubexd-server:latest
            ghcr.io/metacubex/metacubexd-server:${{ needs.release-please.outputs.tag_name }}
