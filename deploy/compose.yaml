name: metacubexd-gateway

services:
  gateway:
    image: '${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to an immutable @sha256 digest}'
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: '${TZ:-Asia/Shanghai}'
      SESSION_COOKIE_SECURE: '${SESSION_COOKIE_SECURE:-true}'
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      GATEWAY_MASTER_KEY_FILE: /run/secrets/gateway_master_key
      CLASH_SECRET_FILE: /run/secrets/clash_secret
    secrets:
      - admin_password
      - gateway_master_key
      - clash_secret
    volumes:
      - gateway-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    read_only: true
    security_opt:
      - no-new-privileges:true

secrets:
  admin_password:
    file: ./secrets/admin_password
  gateway_master_key:
    file: ./secrets/gateway_master_key
  clash_secret:
    file: ./secrets/clash_secret

volumes:
  gateway-data:
